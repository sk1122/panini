_metadata:
  major_version: 1

display_information:
  name: Panini Work
  description: Capture explicitly marked work evidence into Panini.
  background_color: "#111111"

features:
  bot_user:
    display_name: panini
    always_online: false

oauth_config:
  scopes:
    bot:
      - channels:history
      - reactions:read
      - users:read

settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - reaction_added
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
  is_hosted: false
