services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: panini_e2e
      POSTGRES_PASSWORD: panini_e2e_disposable_only
      POSTGRES_DB: panini_e2e
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panini_e2e -d panini_e2e"]
      interval: 2s
      timeout: 2s
      retries: 20
